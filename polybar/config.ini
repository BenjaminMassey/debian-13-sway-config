[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 24pt
radius = 6

bottom = false

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = monospace;2

modules-left = xworkspaces xwindow
modules-right = systray filesystem pulseaudio cpu gpu memory vram network battery date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

; the module hardwires left click to mute, so wrap the labels in action tags
; instead: left click opens the mixer, right click toggles mute
label-volume = %{A1:pavucontrol &:}%{A3:pactl set-sink-mute @DEFAULT_SINK@ toggle:}%percentage%%%{A}%{A}

label-muted = %{A1:pavucontrol &:}%{A3:pactl set-sink-mute @DEFAULT_SINK@ toggle:}muted%{A}%{A}
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/gpu]
type = custom/script
exec = ~/.config/polybar/gpu.sh busy
interval = 2
format-prefix = "GPU "
format-prefix-foreground = ${colors.primary}

[module/vram]
type = custom/script
exec = ~/.config/polybar/gpu.sh vram
interval = 2
format-prefix = "VRAM "
format-prefix-foreground = ${colors.primary}

[module/network]
type = custom/script
exec = ~/.config/polybar/net.sh
interval = 5

[module/battery]
; batt.sh prints nothing on machines without a battery, which hides the module
type = custom/script
exec = ~/.config/polybar/batt.sh
interval = 10

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d %H:%M

label = %date%
label-foreground = ${colors.primary}

[module/powermenu]
type = custom/menu

expand-right = false

format-spacing = 1

label-open = "Exit"
label-open-foreground = ${colors.primary}
label-close = Cancel
label-close-foreground = ${colors.primary}
label-separator = |
label-separator-foreground = ${colors.primary}

;Powermenu
menu-0-0 = "Reboot"
menu-0-0-exec = systemctl reboot
menu-0-0-foreground = ${colors.primary}

menu-0-1 = "Shutdown"
menu-0-1-exec = systemctl poweroff
menu-0-1-foreground = ${colors.primary}

menu-0-2 = "Logout"
menu-0-2-exec = killall pick-full-wm
menu-0-2-foreground = ${colors.primary}


[settings]
screenchange-reload = true
pseudo-transparency = true


; vim:ft=dosini
